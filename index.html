<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unterrichtsdokumentation</title>
    <meta
      name="description"
      content="Tagesberichte für Unterricht, Aufgaben und Teilnehmerbeobachtungen erfassen und exportieren."
    />
    <meta property="og:title" content="Unterrichtsdokumentation" />
    <meta
      property="og:description"
      content="Tagesberichte klar erfassen und als PDF oder Excel exportieren."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://amechouate.github.io/Unterrichtdokumentation/og.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://amechouate.github.io/Unterrichtdokumentation/og.png"
    />
    <style id="embedded-app-styles">__APP_STYLE_SOURCE__</style>
  </head>
  <body>
    <div id="root">
      <main
        data-app-fallback
        style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7f8;color:#18324a"
      >
        <div style="max-width:440px;text-align:center">
          <div
            aria-hidden="true"
            style="width:42px;height:4px;margin:0 auto 18px;background:#17847a"
          ></div>
          <strong style="font-size:20px">Unterrichtsdokumentation</strong>
          <p data-loading-message style="margin:10px 0 0;color:#657681;line-height:1.5">
            Anwendung wird geladen …
          </p>
        </div>
      </main>
    </div>
    <script>
      if (typeof globalThis === "undefined") window.globalThis = window;
      if (typeof window.process === "undefined") {
        window.process = {
          browser: true,
          env: { NODE_ENV: "production" },
          version: "",
          nextTick: function (callback) {
            Promise.resolve().then(callback);
          },
        };
      }
      window.setTimeout(function () {
        if (window.__DOCUMENTATION_APP_STARTED__) return;
        var source = document.getElementById("fallback-app-source");
        if (!source) return;
        window.__DOCUMENTATION_CLASSIC_BUNDLE__ = true;
        var script = document.createElement("script");
        script.text = source.textContent || "";
        document.head.appendChild(script);
      }, 2500);
      window.setTimeout(function () {
        var fallback = document.querySelector("[data-app-fallback]");
        var message = document.querySelector("[data-loading-message]");
        if (!fallback || !message) return;
        message.innerHTML =
          'Die Anwendung konnte noch nicht geladen werden. <a href="' +
          window.location.pathname +
          '?neu=' +
          Date.now() +
          '" style="color:#116c64;font-weight:700">Erneut laden</a>';
      }, 8000);
    </script>
    <script id="fallback-app-source" type="text/plain">__FALLBACK_APP_SOURCE__</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
